version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/rag-platform"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/rag-platform/apps/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/rag-platform/apps/scheduler"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/rag-platform/apps/workers"
    schedule:
      interval: "weekly"
