name: Web RAG quality
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-quality.yml', 'vercel.json']
  pull_request:
    paths: ['web/**', '.github/workflows/web-quality.yml', 'vercel.json']
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:hardening
      - run: npm run test:persistence
      - run: npx --yes tsx --test src/lib/rag/*.test.ts
