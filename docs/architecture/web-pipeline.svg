<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc"><title id="title">IntelliRAG web: source to answer</title><desc id="desc">Sources are split and stored. Questions check the cache, then retrieve and pack passages, classify evidence, optionally consult a second-opinion gate, and return a grounded answer or a refusal. Evaluation is separate.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6f9088"/></marker></defs><rect width="1080" height="790" fill="#f6f9f7"/><g font-family="system-ui, sans-serif"><text x="36" y="42" font-size="27" fill="#242b31" font-weight="600">IntelliRAG / source to answer</text><text x="36" y="69" font-size="14" fill="#52616c" font-weight="400">TypeScript web app · code map at b431f76 · Python platform is separate</text><text x="36" y="108" font-size="12" fill="#246e62" font-weight="600">INDEX ON IMPORT</text><g><rect x="36" y="124" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="54" y="148" font-size="12" fill="#246e62" font-weight="600">01</text><text x="54" y="172" font-size="18" fill="#242b31" font-weight="600">Pin the source</text><text x="54" y="192" font-size="13" fill="#52616c" font-weight="400">Repository / file / issue</text></g><g><rect x="384" y="124" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="402" y="148" font-size="12" fill="#246e62" font-weight="600">02</text><text x="402" y="172" font-size="18" fill="#242b31" font-weight="600">Split into passages</text><text x="402" y="192" font-size="13" fill="#52616c" font-weight="400">Headings, code and provenance</text></g><g><rect x="732" y="124" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="750" y="148" font-size="12" fill="#246e62" font-weight="600">03</text><text x="750" y="172" font-size="18" fill="#242b31" font-weight="600">Store + optional vectors</text><text x="750" y="192" font-size="13" fill="#52616c" font-weight="400">Local PGlite / configured Postgres</text></g><path d="M348 165 L382 165" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><path d="M696 165 L730 165" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><text x="36" y="250" font-size="12" fill="#246e62" font-weight="600">ANSWER ON REQUEST</text><g><rect x="36" y="266" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="54" y="290" font-size="12" fill="#246e62" font-weight="600">04</text><text x="54" y="314" font-size="18" fill="#242b31" font-weight="600">Question, corpus, cache</text><text x="54" y="334" font-size="13" fill="#52616c" font-weight="400">Valid hit returns a stored answer</text></g><g><rect x="384" y="266" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="402" y="290" font-size="12" fill="#246e62" font-weight="600">05</text><text x="402" y="314" font-size="18" fill="#242b31" font-weight="600">Retrieve, rank, pack</text><text x="402" y="334" font-size="13" fill="#52616c" font-weight="400">BM25 / optional dense + RRF</text></g><g><rect x="732" y="266" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="750" y="290" font-size="12" fill="#246e62" font-weight="600">06</text><text x="750" y="314" font-size="18" fill="#242b31" font-weight="600">Evidence gate</text><text x="750" y="334" font-size="13" fill="#52616c" font-weight="400">Ambiguous can still generate</text></g><path d="M348 307 L382 307" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><path d="M696 307 L730 307" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><path d="M888 206 V230 H540 V264" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><text x="461" y="251" font-size="12" fill="#52616c" font-weight="400">stored passages</text><g><rect x="732" y="410" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="750" y="434" font-size="12" fill="#246e62" font-weight="600">07</text><text x="750" y="458" font-size="18" fill="#242b31" font-weight="600">Optional second opinion</text><text x="750" y="478" font-size="13" fill="#52616c" font-weight="400">Can tighten a positive gate only</text></g><path d="M888 348 L888 408" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><text x="901" y="382" font-size="12" fill="#52616c" font-weight="400">positive only</text><g><rect x="384" y="410" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="402" y="434" font-size="12" fill="#246e62" font-weight="600">08</text><text x="402" y="458" font-size="18" fill="#242b31" font-weight="600">Answer or explain the gap</text><text x="402" y="478" font-size="13" fill="#52616c" font-weight="400">Model / cited extracts / refusal</text></g><path d="M732 451 L698 451" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><path d="M192 348 V451 H382" fill="none" stroke="#6f9088" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="49" y="389" font-size="12" fill="#52616c" font-weight="400">cache hit bypasses stages 05-07</text><path d="M1045 308 H1060 V520 H540 V494" fill="none" stroke="#6f9088" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="736" y="540" font-size="12" fill="#52616c" font-weight="400">insufficient / negative-not-found</text><g><rect x="384" y="568" width="312" height="82" rx="8" fill="white" stroke="#ccd8d4"/><text x="402" y="592" font-size="12" fill="#246e62" font-weight="600">09</text><text x="402" y="616" font-size="18" fill="#242b31" font-weight="600">Inspect, cite, give feedback</text><text x="402" y="636" font-size="13" fill="#52616c" font-weight="400">Source links / trace / graph</text></g><path d="M540 492 L540 566" fill="none" stroke="#6f9088" stroke-width="1.5" marker-end="url(#a)"/><rect x="36" y="688" width="1008" height="72" rx="8" fill="white" stroke="#ccd8d4" stroke-dasharray="5 4"/><text x="54" y="715" font-size="17" fill="#242b31" font-weight="600">E / Separate evaluation runner</text><text x="54" y="739" font-size="14" fill="#52616c" font-weight="400">Golden evidence + optional model judging. Not a mandatory step between a question and its answer.</text></g></svg>